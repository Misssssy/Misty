<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#FAFAFA">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no,email=no,address=no">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='50' font-size='52'%3E%F0%9F%92%A1%3C/text%3E%3C/svg%3E">
<title>我的个人工作台</title>
<style>
:root{
  --bg:#FAFAFA;
  --nav:#F5F5F5;
  --ink:#3A3A3A;
  --ink2:#6B6B6B;
  --ink3:#9A9A9A;
  --line:#ECECEC;
  --navw:15vw;
  --r:16px;
  --sh:0 2px 10px rgba(0,0,0,.04);
  --ease:cubic-bezier(.22,.61,.36,1);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{
  width:100%;
  max-width:100vw;
  overflow-x:hidden;
  overscroll-behavior-x:none;
}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg);
  color:var(--ink);
  font-size:15px;
  line-height:1.65;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeSpeed;
  position:fixed;
  inset:0;
}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit;border:none;outline:none;background:none}
img{max-width:100%;display:block}

/* ===== 布局骨架：左15%固定导航 + 右85%内容 ===== */
#app{
  display:flex;
  width:100%;
  height:100vh;
  height:100dvh;
  overflow:hidden;
}

/* ---- 左侧导航 ---- */
#nav{
  width:var(--navw);
  min-width:var(--navw);
  max-width:var(--navw);
  height:100%;
  background:var(--nav);
  border-right:1px solid var(--line);
  overflow-y:auto;
  overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:none;
  padding:calc(6px + env(safe-area-inset-top)) 0 calc(10px + env(safe-area-inset-bottom));
  display:flex;
  flex-direction:column;
  gap:2px;
}
#nav::-webkit-scrollbar{display:none}

#brand{
  text-align:center;
  font-size:9px;
  line-height:1.25;
  color:var(--ink3);
  letter-spacing:.5px;
  padding:2px 2px 8px;
  font-weight:600;
}
#brand b{display:block;font-size:15px;color:var(--ink2);letter-spacing:0}
#brand #bdate{
  display:block;font-size:8px;color:var(--ink3);margin-top:1px;
  letter-spacing:-.2px;line-height:1.3;
}
#brand #brefresh{
  display:inline-flex;align-items:center;justify-content:center;
  width:22px;height:22px;border-radius:50%;
  background:#fff;color:var(--ink2);font-size:13px;line-height:1;
  margin-top:4px;cursor:pointer;
  box-shadow:0 1px 4px rgba(0,0,0,.06);
  transition:transform .4s var(--ease),background .25s var(--ease),color .25s var(--ease);
  -webkit-user-select:none;user-select:none;
}
#brand #brefresh:active{transform:scale(.88);background:var(--acc,#EFEFEF)}
#brand #brefresh.spin{transform:rotate(360deg)}

.navitem{
  position:relative;
  flex:0 0 auto;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:3px;
  padding:7px 1px;
  min-height:52px;
  cursor:pointer;
  color:var(--ink2);
  transition:background .28s var(--ease),color .28s var(--ease),transform .18s var(--ease);
  -webkit-user-select:none;user-select:none;
  border-radius:0 12px 12px 0;
  margin-right:6px;
}
.navitem .ico{
  font-size:17px;
  line-height:1;
  transition:transform .34s var(--ease);
  filter:grayscale(.15);
}
.navitem .txt{
  font-size:8.5px;
  line-height:1.15;
  text-align:center;
  letter-spacing:-.2px;
  font-weight:600;
  word-break:break-all;
  max-width:100%;
  padding:0 1px;
}
.navitem .dot{
  position:absolute;
  left:0;top:50%;
  width:3px;height:0;
  border-radius:0 3px 3px 0;
  background:var(--acc,#C9C9C9);
  transform:translateY(-50%);
  transition:height .3s var(--ease);
}
.navitem.on{color:var(--ink);background:#fff}
.navitem.on .ico{transform:scale(1.16)}
.navitem.on .dot{height:26px}
.navitem:active{transform:scale(.94)}

/* ---- 右侧内容区 ---- */
#main{
  flex:1 1 auto;
  width:85%;
  max-width:85%;
  min-width:0;
  height:100%;
  overflow-y:auto;
  overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:none;
  padding:calc(12px + env(safe-area-inset-top)) 12px calc(28px + env(safe-area-inset-bottom)) 11px;
}
#main::-webkit-scrollbar{display:none}

.view{display:none;animation:viewin .38s var(--ease)}
.view.on{display:block}
@keyframes viewin{
  from{opacity:0;transform:translateY(12px) scale(.99)}
  to{opacity:1;transform:none}
}

/* ---- 头部 ---- */
.head{margin-bottom:12px;padding-left:2px}
.head h1{
  font-size:19px;
  font-weight:800;
  letter-spacing:-.4px;
  display:flex;
  align-items:center;
  gap:6px;
  line-height:1.3;
}
.head p{font-size:11px;color:var(--ink3);margin-top:2px;letter-spacing:.2px}

/* ---- 卡片 ---- */
.card{
  background:#fff;
  border-radius:var(--r);
  padding:13px 13px;
  margin-bottom:10px;
  box-shadow:var(--sh);
  border:1px solid rgba(0,0,0,.02);
  transform:translateZ(0);
}
.card.tint{background:var(--bgc,#fff)}
.card h2{
  font-size:13px;
  font-weight:800;
  margin-bottom:9px;
  display:flex;
  align-items:flex-start;
  gap:6px;
  letter-spacing:-.2px;
  color:var(--ink);
  flex-wrap:nowrap;
  min-width:0;
  line-height:1.4;
}
.card h2 .badge{
  margin-left:auto;
  font-size:9.5px;
  font-weight:700;
  padding:2px 7px;
  border-radius:20px;
  background:rgba(255,255,255,.85);
  color:var(--ink2);
  letter-spacing:0;
  white-space:nowrap;
  flex:0 0 auto;
  word-break:keep-all;
}

/* ---- 通用按钮 ---- */
.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:5px;
  padding:9px 14px;
  border-radius:11px;
  font-size:12.5px;
  font-weight:700;
  background:#fff;
  color:var(--ink);
  border:1px solid var(--line);
  cursor:pointer;
  transition:transform .16s var(--ease),background .25s var(--ease),box-shadow .25s var(--ease);
  -webkit-user-select:none;user-select:none;
}
.btn:active{transform:scale(.95)}
.btn.pri{background:var(--acc,#4A4A4A);color:#fff;border-color:transparent;box-shadow:0 3px 10px var(--accs,rgba(0,0,0,.12))}
.btn.pri:active{box-shadow:0 1px 4px var(--accs,rgba(0,0,0,.12))}
.btn.wide{width:100%}
.btn.sm{padding:6px 10px;font-size:11px;border-radius:9px}

/* ---- 输入框 ---- */
.ta,.in{
  width:100%;
  background:#fff;
  border:1px solid var(--line);
  border-radius:12px;
  padding:10px 12px;
  font-size:13.5px;
  line-height:1.6;
  resize:none;
  transition:border-color .25s var(--ease),box-shadow .25s var(--ease);
}
.ta:focus,.in:focus{border-color:var(--acc,#BBB);box-shadow:0 0 0 3px var(--accs,rgba(0,0,0,.05))}
.ta::placeholder,.in::placeholder{color:var(--ink3)}

/* ---- 列表 / 条目 ---- */
.item{
  background:#fff;
  border-radius:12px;
  padding:10px 11px;
  margin-bottom:8px;
  border:1px solid rgba(0,0,0,.025);
  transition:transform .2s var(--ease);
}
.item:active{transform:scale(.985)}
.item:last-child{margin-bottom:0}
.item .t{font-size:13px;font-weight:700;margin-bottom:3px;letter-spacing:-.2px}
.item .d{font-size:11.5px;color:var(--ink2);line-height:1.62}
.item .m{font-size:10px;color:var(--ink3);margin-top:5px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}

.tag{
  display:inline-block;
  font-size:9.5px;
  font-weight:700;
  padding:2.5px 7px;
  border-radius:20px;
  background:var(--tg,#F1F1F1);
  color:var(--ink2);
  margin:0 4px 4px 0;
  letter-spacing:0;
}

/* ---- 勾选行 ---- */
.chk{
  display:flex;
  align-items:flex-start;
  gap:9px;
  padding:9px 10px;
  background:#fff;
  border-radius:12px;
  margin-bottom:7px;
  cursor:pointer;
  transition:background .25s var(--ease),transform .18s var(--ease),opacity .25s var(--ease);
  border:1px solid rgba(0,0,0,.025);
}
.chk:active{transform:scale(.985)}
.chk .box{
  flex:0 0 auto;
  width:19px;height:19px;
  border-radius:7px;
  border:1.8px solid #DCDCDC;
  display:flex;align-items:center;justify-content:center;
  font-size:11px;color:#fff;
  transition:background .25s var(--ease),border-color .25s var(--ease),transform .25s var(--ease);
  margin-top:1px;
}
.chk .lb{font-size:12.5px;line-height:1.55;flex:1}
.chk .lb small{display:block;font-size:10.5px;color:var(--ink3);margin-top:1px}
.chk.done{opacity:.62}
.chk.done .lb{text-decoration:line-through;text-decoration-color:var(--ink3)}
.chk.done .box{background:var(--acc,#4A4A4A);border-color:var(--acc,#4A4A4A);transform:scale(1.06)}

/* ---- 进度条 ---- */
.bar{height:9px;border-radius:9px;background:#EFEFEF;overflow:hidden;margin:7px 0 4px}
.bar i{
  display:block;height:100%;border-radius:9px;
  background:var(--acc,#888);
  width:0;
  transition:width .7s var(--ease);
}
.kv{display:flex;align-items:baseline;gap:5px}
.kv b{font-size:23px;font-weight:800;letter-spacing:-1px}
.kv span{font-size:11px;color:var(--ink3)}

/* ---- 网格 ---- */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.stat{
  background:#fff;
  border-radius:12px;
  padding:9px 10px;
  text-align:center;
  border:1px solid rgba(0,0,0,.025);
}
.stat b{display:block;font-size:18px;font-weight:800;letter-spacing:-.6px;line-height:1.25}
.stat span{font-size:10px;color:var(--ink3)}
.stat em{font-size:9.5px;font-style:normal;color:var(--ink2)}

/* ---- 打卡日历 ---- */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .wd{font-size:9.5px;color:var(--ink3);text-align:center;font-weight:700;padding-bottom:2px}
.cal .d{
  aspect-ratio:1;
  border-radius:9px;
  display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:700;
  background:#F4F4F4;color:var(--ink3);
  transition:background .3s var(--ease),color .3s var(--ease),transform .2s var(--ease);
  cursor:pointer;
  -webkit-user-select:none;user-select:none;
}
.cal .d:active{transform:scale(.9)}
.cal .d.on{background:var(--acc,#8FCFA8);color:#fff}
.cal .d.today{box-shadow:0 0 0 2px var(--acc,#8FCFA8) inset;color:var(--ink)}
.cal .d.on.today{color:#fff;box-shadow:none}
.cal .d.blank{background:transparent;cursor:default;pointer-events:none}

/* ---- 折叠 ---- */
.fold{
  background:#fff;border-radius:12px;margin-bottom:8px;overflow:hidden;
  border:1px solid rgba(0,0,0,.025);
}
.fold>summary{
  list-style:none;cursor:pointer;
  padding:11px 12px;
  font-size:13px;font-weight:700;
  display:flex;align-items:center;gap:7px;
  transition:background .25s var(--ease);
}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary:active{background:#FAFAFA}
.fold>summary .arw{margin-left:auto;font-size:10px;color:var(--ink3);transition:transform .3s var(--ease)}
.fold[open]>summary .arw{transform:rotate(90deg)}
.fold .body{padding:0 12px 12px;animation:viewin .3s var(--ease)}

/* ---- 跟读卡 ---- */
.spk{
  background:#fff;border-radius:13px;padding:12px;
  margin-bottom:9px;border:1px solid rgba(0,0,0,.025);
  transition:transform .2s var(--ease);
}
.spk .en{font-size:14px;font-weight:700;line-height:1.5;letter-spacing:-.2px}
.spk .cn{font-size:11.5px;color:var(--ink2);margin-top:3px}
.spk .row{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap;align-items:center}
.spk .tip{font-size:9.5px;color:var(--ink3)}
.spk.done{background:var(--bgc,#F7FBF8)}

/* ---- 树洞 ---- */
.ta.lg{min-height:118px}
.note{
  background:#fff;border-radius:12px;padding:10px 11px;margin-bottom:8px;
  border:1px solid rgba(0,0,0,.025);
  animation:viewin .3s var(--ease);
}
.note .nt{font-size:9.5px;color:var(--ink3);display:flex;align-items:center;gap:6px;margin-bottom:4px}
.note .nc{font-size:12.5px;line-height:1.7;white-space:pre-wrap;word-break:break-word}
.note .del{margin-left:auto;font-size:14px;color:#D6D6D6;padding:0 2px;cursor:pointer;transition:color .2s}
.note .del:active{color:#E88}

/* ---- 提示 ---- */
.toast{
  position:fixed;
  left:50%;bottom:calc(24px + env(safe-area-inset-bottom));
  transform:translate(-50%,20px);
  background:rgba(58,58,58,.94);
  color:#fff;font-size:12px;font-weight:600;
  padding:9px 17px;border-radius:22px;
  opacity:0;pointer-events:none;
  transition:opacity .3s var(--ease),transform .3s var(--ease);
  z-index:99;white-space:nowrap;max-width:82vw;
  backdrop-filter:blur(8px);
}
.toast.on{opacity:1;transform:translate(-50%,0)}

.empty{text-align:center;font-size:11.5px;color:var(--ink3);padding:16px 8px}
.hr{height:1px;background:var(--line);margin:10px 0}
.mini{font-size:10.5px;color:var(--ink3);line-height:1.6}
.pill{display:inline-block;font-size:10px;font-weight:700;padding:3px 9px;border-radius:20px;background:#F3F3F3;color:var(--ink2);margin:0 4px 5px 0;cursor:pointer;transition:background .22s var(--ease),color .22s var(--ease)}
.pill:active{transform:scale(.94)}
.quote{
  font-size:13.5px;line-height:1.75;font-weight:600;
  letter-spacing:-.2px;color:var(--ink);
}
.quote:before{content:"“";font-size:24px;color:var(--acc,#CCC);line-height:0;vertical-align:-6px;margin-right:2px}
.quote:after{content:"”";font-size:24px;color:var(--acc,#CCC);line-height:0;vertical-align:-8px;margin-left:2px}
</style>
</head>
<body>
<div id="app">
  <nav id="nav">
    <div id="brand"><b>工作台</b><span id="bdate"></span>
      <a id="bgrowth" href="成长打卡.html" title="个人成长打卡" style="display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:#fff;color:var(--ink2);font-size:12px;line-height:1;margin-top:4px;cursor:pointer;text-decoration:none;box-shadow:0 1px 4px rgba(0,0,0,.06)">⚓</a>
      <span id="brefresh" title="刷新今日内容">⟳</span>
    </div>
  </nav>
  <main id="main"></main>
</div>
<div class="toast" id="toast"></div>

<script>
/* =========================================================
   工具 & 本地存储
   ========================================================= */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const LS={
  get(k,d){try{const v=localStorage.getItem('wb_'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem('wb_'+k,JSON.stringify(v))}catch(e){}},
};
const todayKey=()=>{const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()};
/* 周标识：返回该日期所在周的周一（YYYY-M-D），用于每周复习归档 */
const weekKey=(dt)=>{const d=dt?new Date(dt):new Date();const day=(d.getDay()+6)%7;const mon=new Date(d);mon.setDate(d.getDate()-day);return mon.getFullYear()+'-'+(mon.getMonth()+1)+'-'+mon.getDate()};
const weekRange=()=>{const now=new Date();const day=(now.getDay()+6)%7;const mon=new Date(now);mon.setDate(now.getDate()-day);const sun=new Date(mon);sun.setDate(mon.getDate()+6);const f=x=>(x.getMonth()+1)+'/'+x.getDate();return f(mon)+' - '+f(sun)};

/* ===== 减脂体质计算 ===== */
const ACT={
  sed:{n:'久坐少动',f:1.2,d:'几乎不运动，以坐姿工作为主'},
  light:{n:'轻度活动',f:1.375,d:'每周运动 1–3 次，或日常走动较多'},
  mid:{n:'中度活动',f:1.55,d:'每周运动 3–5 次，有规律训练'},
  high:{n:'高强度',f:1.725,d:'每周运动 6–7 次，或体力劳动'}
};
/* BMR：Mifflin-St Jeor 公式（国际通用，误差最小） */
const calcBMR=(sex,w,h,age)=>Math.round(10*w+6.25*h-5*age+(sex==='m'?5:-161));
const calcBMI=(w,h)=>{if(!w||!h)return 0;const m=h/100;return Math.round(w/(m*m)*10)/10};
const bmiTag=(b)=>{if(b<18.5)return{n:'偏瘦',c:'#9FC3EA'};if(b<24)return{n:'正常',c:'#8FCFA8'};if(b<28)return{n:'偏胖',c:'#EFC88B'};return{n:'肥胖',c:'#F0A8A8'}};
/* 理想体重区间（BMI 18.5–24 对应） */
const idealRange=(h)=>{const m=h/100;return[Math.round(18.5*m*m*10)/10,Math.round(24*m*m*10)/10]};

/* ===== 央妈减肥法 / 《成人肥胖食养指南（2024年版）》 =====
   国家卫健委发布，常被称作"央妈减肥法"。核心是可量化的几条：
   ① 热量：在消耗基础上每天减 500–1000 kcal，或减 30%–50%；
      限能量平衡膳食参考区间为 男 1200–1500、女 1000–1200 kcal/d
   ② 供能比：碳水 50%–60%、脂肪 20%–30%、蛋白质 15%–20%
   ③ 三餐供能比 3:4:3
   ④ 晚餐 17:00–19:00，晚餐后不再进食（可饮水）
   ⑤ 进餐顺序：蔬菜 → 肉类 → 主食
   ⑥ 盐 <5g/d，烹调油 15–25g/d
   ⑦ 减重速度 每月 2–4kg（每周约 0.5–1kg），半年减当前体重 5%–10%
   ⑧ 饮水 1500–2000ml；睡眠约 7 小时；每周有氧 150–300 分钟 */
const OFFICIAL={
  kcal:{m:[1200,1500],f:[1000,1200]},       /* 限能量平衡膳食参考区间 */
  cut:[500,1000],                           /* 每日能量缺口区间 */
  pct:[30,50],                              /* 或按消耗的 30%–50% 减少 */
  macro:{carb:[50,60],fat:[20,30],pro:[15,20]},
  mealRatio:[3,4,3],                        /* 早:中:晚 */
  dinner:[17,19],                           /* 晚餐时段 */
  oil:[15,25],salt:5,
  lossWeek:[0.5,1],lossMonth:[2,4],
  water:[1500,2000],
  aerobic:[150,300],resist:[2,3]
};

/* 七大地区四季食谱（节选自指南的示例菜单，热量按 1200/1400/1600 三档）
   字段：b=早餐 l=中餐 d=晚餐 k=该组合参考热量 */
const REGION={
  hd:{n:'华东',e:'🌊',t:'主食以大米为主，湖鲜河鲜丰富，口味偏清淡',
    s:{'春':[

/* ===== 英语每日轮换 =====
   目的：英语资讯与口语内容每天自动换一批，避免长期只盯着同几条。
   策略（环形轮转，稳定且刷新感最强）：
     1) 以"距某个基准日的天数"计算偏移量，每天整体向前推进一步；
     2) 阅读与口琴使用不同的步长，避免两者同步导致观感单调；
     3) 同一天内顺序恒定（不跳动），跨天则整体换位；
     4) 已读进度按"原始索引"记录、口语打卡按"句子内容"记录，
        所以跨天换序后进度依旧准确对应，不会串位。
   这样即使内容条目数有限，也不会出现"连续两天头条一样"的情况。 */
let _enDay=null,_enRead=null,_enSpk=null;
/* 基准日：2024-01-01（周一），用它算天数差，保证任意日期都有稳定偏移 */
const EN_BASE=new Date(2024,0,1);
const enDayNo=tk=>{
  const p=String(tk).split('-');
  const d=new Date(+p[0],(+p[1])-1,+p[2]);
  return Math.floor((d-EN_BASE)/86400000);
};
/* 环形轮转：把数组整体前移 offset 位（保证集合不变，仅顺序变化） */
const ringShift=(arr,offset)=>{
  const n=arr.length;if(!n)return arr.slice();
  const k=((offset%n)+n)%n;
  return arr.slice(k).concat(arr.slice(0,k));
};
/* 手动刷新时额外加一次扰动，让"刷新"当下就能看到变化 */
let _enBoost=0;
const reshuffleEN=()=>{_enBoost++; _enRead=null;_enSpk=null;};
const ensureEN=()=>{
  const tk=todayKey();
  if(_enDay===tk&&_enRead&&_enSpk)return;
  const day=enDayNo(tk)+_enBoost;
  const nR=D.英语阅读.length, nS=D.英语口语.length;
  /* 步长与数组长度互质，保证长期轮转能遍历到每一个条目 */
  _enRead=ringShift(D.英语阅读,(day*3)%nR);
  _enSpk=ringShift(D.英语口语,(day*5+2)%nS);
  _enDay=tk;
};
/* 当日展示用的英语数据集（阅读为"今日推荐"顺序，口语为"今日轮换"顺序） */
const enReads=()=>{ensureEN();return _enRead};
const enSpeaks=()=>{ensureEN();return _enSpk};
/* 通过阅读对象反查它在原始数据中的索引（已读标记以原始索引存档，跨天不丢失） */
const readIdx=r=>D.英语阅读.indexOf(r);

/* 打卡状态按日存储：{d:'日期', k:{标识:true}}
   跨天后自动视为全新一天，已完成项归零、重新开始。 */

    if(v!==null)LS.set(key,fresh);      /* 有旧数据才回写，避免无谓写入 */

};

const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]]}return a};

/* ===== 天气获取 =====
   使用 Open-Meteo 免费接口（无需 API Key）。
   定位优先走浏览器 Geolocation，被拒或超时则回退到 IP 粗略定位。
   全程失败时降级为手动填写，不影响模块使用。 */
const WMO={

  61:{n:'小雨',e:'🌧'},63:{n:'中雨',e:'🌧'},65:{n:'大雨',e:'🌧'},
  66:{n:'冻雨',e:'🌨'},67:{n:'强冻雨',e:'🌨'},
  71:{n:'小雪',e:'🌨'},73:{n:'中雪',e:'❄️'},75:{n:'大雪',e:'❄️'},77:{n:'米雪',e:'🌨'},
  80:{n:'阵雨',e:'🌦'},81:{n:'强阵雨',e:'🌧'},82:{n:'暴雨',e:'⛈'},

  95:{n:'雷阵雨',e:'⛈'},96:{n:'雷阵雨伴冰雹',e:'⛈'},99:{n:'强雷暴',e:'⛈'}

const wmoOf=c=>WMO[c]||{n:'未知',e:'🌡'};
/* 温度和降水 → 体感档位，供穿搭规则使用 */
const tempBand=t=>t>=30?'hot':t>=24?'warm':t>=17?'mild':t>=10?'cool':t>=0?'cold':'freezing';
const BANDN={hot:'炎热',warm:'温暖',mild:'舒适',cool:'微凉',cold:'寒冷',freezing:'严寒'};
const isRainy=c=>(c>=51&&c<=67)||(c>=80&&c<=82)||c>=95;
const isSnowy=c=>(c>=71&&c<=77)||c===85||c===86;

/* 天气新鲜度：多久算"过期"需要重新拉取 */
const WX_TTL=60*60*1000;                 /* 自动获取的天气缓存有效期：1 小时 */
const WX_REFRESH_GAP=5*60*1000;          /* 两次自动刷新之间的最小间隔，防抖：5 分钟 */
const WX_LAST='wxLastTry';               /* 上一次尝试自动获取的时间戳 */

/* 天气是否已过期（手动填写的天气不算过期，始终以用户输入为准） */
const wxFresh=w=>!!w&&typeof w.at==='number'&&(Date.now()-w.at)<WX_TTL;

/* 天气来源的展示文案：实时 / 缓存 / 手动 */
const wxSrc=(w)=>{
  if(!w)return '未获取';
  if(w.manual)return '手动填写';
  return wxFresh(w)?'实时':'缓存';
};

/* 天气状态行：展示"上次更新时间 + 新鲜度"，并提供刷新入口 */
const wxStamp=(w)=>{
  if(!w||!w.at)return '';
  const d=new Date(w.at);
  const p2=n=>String(n).padStart(2,'0');
  const hm=p2(d.getHours())+':'+p2(d.getMinutes());
  const age=Date.now()-w.at;
  let ago;
  if(age<60*1000)ago='刚刚';
  else if(age<60*60*1000)ago=Math.floor(age/60000)+' 分钟前';
  else if(age<24*60*60*1000)ago=Math.floor(age/3600000)+' 小时前';
  else ago=Math.floor(age/86400000)+' 天前';
  const stale=(!w.manual&&!wxFresh(w));
  return `<div class="mini" style="margin-top:4px;${stale?'color:#D08A6A':''}">${stale?'⚠️ ':''}更新于 ${hm} · ${ago}${stale?' · 建议刷新':''}</div>`;
};

/* 逆地理编码：把经纬度换成可核对的城市名
   走 BigDataCloud 的免费反向地理接口（无需 Key，支持中文）。
   失败不抛出——城市名只是"便于核对"的辅助信息，拿不到就退回坐标展示。 */
const revGeo=async(lat,lon)=>{
  /* 加超时：地名只是辅助信息，绝不能拖慢天气本身 */
  const ctl=(typeof AbortController!=='undefined')?new AbortController():null;
  const timer=ctl?setTimeout(()=>ctl.abort(),4500):null;
  try{
    const q='https://api.bigdatacloud.net/data/reverse-geocode-client?latitude='+lat
      +'&longitude='+lon+'&localityLanguage=zh';
    const r=await fetch(q,ctl?{cache:'no-store',signal:ctl.signal}:{cache:'no-store'});
    if(!r.ok)return null;
    const j=await r.json();
    if(!j)return null;
    /* 逐级拼装便于核对的地名：省 · 市，市与省同名时（直辖市）只留一个 */
    const prov=j.principalSubdivision||'';
    const city=j.city||'';
    const dist=j.locality||'';
    const parts=[];
    [prov,city].forEach(x=>{if(x&&!parts.includes(x))parts.push(x)});
    const label=parts.length?parts.join('·'):(dist||'');
    if(!label)return null;
    return {
      city:label,
      district:(dist&&dist!==city)?dist:'',
      country:j.countryName||'',
      countryCode:j.countryCode||''
    };
  }catch(e){/* 静默失败，交由上层兜底 */}
  finally{if(timer)clearTimeout(timer)}
  return null;
};

/* 拉取天气：先定位，再请求 Open-Meteo */
const fetchWeather=async()=>{
  const geoOnce=(opts)=>new Promise((res,rej)=>{
    if(!navigator.geolocation)return rej(new Error('no-geo'));
    navigator.geolocation.getCurrentPosition(p=>res(p.coords),e=>rej(e),opts);
  });
  let lat,lon,city='',country='',district='',src='';
  try{
    const c=await geoOnce({enableHighAccuracy:false,timeout:8000,maximumAge:10*60*1000});
    lat=c.latitude;lon=c.longitude;src='gps';
    /* 定位成功后做逆地理编码，拿到城市名便于核对 */
    const g=await revGeo(lat,lon);
    if(g){city=g.city;country=g.country;district=g.district||''}
  }catch(e){
    /* 回退：用 IP 粗略定位（同样免费、无需 Key） */
    try{
      const r=await fetch('https://ipapi.co/json/',{cache:'no-store'});
      const j=await r.json();
      if(!j||!j.latitude)throw new Error('ip-fail');
      lat=j.latitude;lon=j.longitude;src='ip';
      /* IP 定位：ipapi 直接给出城市名，且与坐标同源，可放心跟随 */
      city=[j.city,j.region].filter(Boolean).filter((x,i,a)=>a.indexOf(x)===i).slice(0,2).join('·')
           ||j.city||j.region||'';
      country=j.country_name||'';
    }catch(e2){const err=new Error('定位失败');err.code='geo';throw err}
  }
  /* 城市名兜底：逆地理与 IP 都没拿到时，用坐标让用户仍可核对 */
  if(!city)city=(Math.abs(lat).toFixed(2)+'°'+((lat>=0)?'N':'S')+', '+Math.abs(lon).toFixed(2)+'°'+((lon>=0)?'E':'W'));
  const url='https://api.open-meteo.com/v1/forecast?latitude='+lat+'&longitude='+lon
    +'&current=temperature_2m,relative_humidity_2m,apparent_temperature,is_day,weather_code,wind_speed_10m'
    +'&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max'
    +'&timezone=auto&forecast_days=3';
  const r=await fetch(url);
  if(!r.ok)throw new Error('天气服务不可用');
  const j=await r.json();
  const cur=j.current||{}, day=(j.daily&&j.daily.time)||[];
  const daily=day.map((d,i)=>({
    d,
    code:(j.daily.weather_code||[])[i],
    hi:(j.daily.temperature_2m_max||[])[i],
    lo:(j.daily.temperature_2m_min||[])[i],
    pop:(j.daily.precipitation_probability_max||[])[i]
  }));
  return {
    t:Math.round(cur.temperature_2m),
    feels:Math.round(cur.apparent_temperature!=null?cur.apparent_temperature:cur.temperature_2m),
    code:cur.weather_code,
    hum:cur.relative_humidity_2m,
    wind:Math.round(cur.wind_speed_10m||0),
    day:cur.is_day!==0,
    city,country,district,src,lat,lon,daily,
    at:Date.now()
  };
};

  freezing:{up:['针织衫','卫衣'],out:['羽绒服','大衣'],down:['长裤'],shoe:['靴子'],acc:['围巾','帽子'],tip:'打底加绒 + 厚外搭，露出皮肤的面积越小越保暖。'}

/* 按天气补充候选：下雨加防水、下雪加极保暖 */
const outfitCandidates=(w)=>{
  const band=tempBand(w?w.feels!=null?w.feels:w.t:20);
  const r=OUTFIT_RULES[band]||OUTFIT_RULES.mild;
  let acc=r.acc.slice(), shoe=r.shoe.slice(), tip=r.tip;
  if(w){
    if(isRainy(w.code)){acc.push('帽子');if(!shoe.includes('靴子'))shoe.push('靴子');tip='有降水，鞋尽量选防水材质，包里放一把折叠伞。';}

    if(w.wind>=25){if(!r.out.includes('风衣')&&!r.out.includes('大衣'))acc.push('帽子');tip='风比较大，外搭选带防风性的款式，避免裙摆类单品。';}
  }
  return {band,up:r.up.slice(),out:r.out.slice(),down:r.down.slice(),shoe,acc,tip};
};
/* 历史偏好：返回 {风格:{k:权重}, 色系:{...}, 品类:{...}, 总条数} */

    if(h.style)f[h.style]=(f[h.style]||0)+1;
    if(h.color)c[h.color]=(c[h.color]||0)+1;
    (h.items||[]).forEach(it=>{if(it)p[it]=(p[it]||0)+1});
  });
  return {f,c,p,total:hist.length,hist};
};
const topK=(obj,k)=>{
  const a=Object.keys(obj).map(n=>({n,v:obj[n]})).sort((x,y)=>y.v-x.v);
  return a.slice(0,k);
};
/* 生成今日推荐：天气候选 × 历史偏好加权取前几名 */
const buildOutfit=(w,prefs)=>{
  const cand=outfitCandidates(w);
  const rank=(list)=>topK(list.reduce((o,n)=>{o[n]=(prefs.p[n]||0)+1;return o},{}),list.length).map(x=>x.n);
  const up=rank(cand.up),out=rank(cand.out),down=rank(cand.down),shoe=rank(cand.shoe),acc=rank(cand.acc);
  /* 风格与色系推荐：有历史就偏向高频，没有就给天气通用建议 */
  const styleTop=topK(prefs.f,2), colorTop=topK(prefs.c,2);
  return {cand,up,out,down,shoe,acc,styleTop,colorTop};
};

/* 图片压缩：等比缩到最长边 max，输出 JPEG，控制 localStorage 占用 */
const compressImage=(file,max,q)=>new Promise((res,rej)=>{
  const fr=new FileReader();
  fr.onerror=()=>rej(new Error('读取图片失败'));
  fr.onload=()=>{
    const im=new Image();
    im.onerror=()=>rej(new Error('图片解析失败'));
    im.onload=()=>{
      const scale=Math.min(1,max/Math.max(im.width,im.height));
      const w=Math.max(1,Math.round(im.width*scale)),h=Math.max(1,Math.round(im.height*scale));
      const cv=document.createElement('canvas');cv.width=w;cv.height=h;
      const cx=cv.getContext('2d');
      cx.fillStyle='#fff';cx.fillRect(0,0,w,h);       /* 透明底转白，避免变黑 */
      cx.drawImage(im,0,0,w,h);
      res({data:cv.toDataURL('image/jpeg',q||.72),w,h});
    };
    im.src=fr.result;
  };
  fr.readAsDataURL(file);
});
/* 便于自动化测试：暴露压缩与占用估算（不影响正常使用） */
if(typeof window!=='undefined'){window.__testCompress=(f,m,q)=>compressImage(f,m,q);window.__testLsBytes=()=>lsBytes();}
/* 估算 localStorage 占用（字节），用于容量提示 */
const lsBytes=()=>{
  let n=0;try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);n+=(k.length+(localStorage.getItem(k)||'').length)*2}}catch(e){}
  return n;
};

/* 安全绑定：元素存在才绑定事件（避免 a && a.x = v 的非法赋值写法） */
function on(sel,evt,fn,exp){const els=(exp||typeof sel!=='string')?[typeof sel==='string'?$(sel):sel]:$$(sel);els.forEach(el=>{if(el)el[evt]=fn});return els[0]}

let tt;
function toast(msg){
  const el=$('#toast');el.textContent=msg;el.classList.add('on');
  clearTimeout(tt);tt=setTimeout(()=>el.classList.remove('on'),1700);
}

/* ① 每日灵感 */
R.灵感=()=>{
  const quotes=D.灵感;
  const idx=LS.get('qidx',null);
  const tk=todayKey();
  let cur=idx;
  if(!cur||cur.d!==tk){cur={d:tk,i:(Math.random()*quotes.length)|0};LS.set('qidx',cur)}
  const notes=LS.get('inspire',[]);
  return `
  <div class="head"><h1>💡 每日灵感</h1><p>每天一句，给心一点向上的力</p></div>
  <div class="card tint" style="--acc:${PASTEL[2].acc};--bgc:${PASTEL[2].bgc}">

    <div class="quote" id="qtext">${esc(quotes[cur.i])}</div>

    <h2>灵感随手记 <span class="badge">${notes.length} 条</span></h2>

/* ② 英语口语 */

  const n=Object.keys(done).length;
  const list=enSpeaks();        /* 今日口语轮换顺序 */
  const reads=enReads();        /* 今日资讯推荐顺序（每日刷新） */

  const rdone=rdLog.k;
  const rn=Object.keys(rdone).length;
  const cat=LS.get('readcat','全部');
  const cats=['全部',...new Set(D.英语阅读.map(r=>r.cat))];

  /* 已完成折叠：把今日已读/已打卡的条目收进汇总，不再铺满列表 */

  const readPending=view.filter(r=>!rdone[readIdx(r)]);
  const readShown=hideDone?readPending:view;
  const readDoneList=view.filter(r=>rdone[readIdx(r)]);
  const spkPending=list.filter(s=>!done[s.en]);
  const spkShown=hideDone?spkPending:list;
  const spkDoneList=list.filter(s=>done[s.en]);

  if(vfilter==='week')vshow=vbook.filter(v=>(v.starWeek||'')===wk);

  const qseed=vbook.length;

      <button class="btn sm" data-hidedone="${hideDone?'0':'1'}">${hideDone?'👁 显示已完成':'🙈 收起已完成'}</button>
    </div>
    ${readDoneList.length?`<div class="mini" style="margin:8px 0 0;color:#9A9A9A">今日已完成 ${readDoneList.length} 篇：${readDoneList.map(r=>esc(r.title)).join(' · ')}</div>`:''}

      <h2><span style="flex:1 1 auto;min-width:0">${esc(r.title)}</span><span class="badge" style="background:${PASTEL[3].tg}">${esc(r.cat)}·${esc(r.tag)}</span></h2>

    </div>
    ${spkDoneList.length?`<div class="mini" style="margin:8px 0 0;color:#9A9A9A">今日已打卡 ${spkDoneList.length} 句：${spkDoneList.map(s=>esc(s.en)).join(' · ')}</div>`:''}
  </div>

  <div id="spklist">${spkShown.length?spkShown.map((s,i)=>{
    const on=!!done[s.en];
    const k=esc(s.en);                       /* 以句子内容为键，跨天轮换后进度仍能对应 */
    return `<div class="spk ${on?'done':''}" style="--bgc:${PASTEL[3].bgc}">
      <div class="en">${esc(s.en)}</div>
      <div class="cn">${esc(s.cn)}</div>
      <div class="row">
        <button class="btn sm" data-say="${list.indexOf(s)}">🔊 试听发音</button>
        <button class="btn sm ${on?'pri':''}" style="--acc:${PASTEL[3].acc};--accs:${PASTEL[3].accs}" data-chk="${k}">${on?'✅ 已打卡':'⭕ 跟读打卡'}</button>
        <button class="btn sm" data-padd="${list.indexOf(s)}">${pmap['p|'+s.en]?'✓ 已收藏':'＋ 收藏'}</button>
        <span class="tip">${esc(s.tip)}</span>
      </div>
    </div>`}).join(''):'<div class="empty">🎉 今日口语已全部打卡，明天将刷新新一批顺序</div>'}</div>`;
};

/* ③ 减脂饮食 */
R.饮食=()=>{
  const tk=todayKey();
  const log=readKcal();
  const total=kcalTotal(log);

  /* ── 体质档案 ── */
  const PB=LS.get('body',null);
  const filled=!!PB&&PB.height>0&&PB.weight>0&&PB.age>0;
  /* 未填档案时用一组中性默认值占位，保证页面结构与文案都正常，但所有结果标记为"待填写" */
  const P=filled?PB:{sex:'f',height:165,weight:60,age:28,act:'light',goal:'lose'};
  const bmr=filled?calcBMR(P.sex,P.weight,P.height,P.age):0;
  const act=ACT[P.act]||ACT.light;
  const tdee=Math.round(bmr*act.f);
  const bmi=calcBMI(P.weight,P.height);
  const bt=bmiTag(bmi);
  const [ilo,ihi]=idealRange(P.height||165);

  /* 目标方向：减脂 / 保持 / 增肌
     —— 减脂目标改按《成人肥胖食养指南》计算：
        ① 先按消耗的 30%–50% 估缺口，再夹在 500–1000 kcal 区间
        ② 同时夹在性别限能量区间（男 1200–1500 / 女 1000–1200）
        ③ 不因公式偏差把目标压到基础代谢以下 */
  const sexKey=P.sex==='m'?'m':'f';
  const kcalRange=OFFICIAL.kcal[sexKey];
  let adjust,target,clampedHigher=false,floorNote='';
  if(P.goal==='lose'){
    const byPct=Math.round(tdee*(1-OFFICIAL.pct[0]/100)/10)*10;
    const byCut=tdee-OFFICIAL.cut[1];
    target=Math.max(byPct,byCut);                      /* 取较保守的一方：缺口不超 50% 也不超 1000 */
    target=Math.min(target,tdee-OFFICIAL.cut[0]);      /* 再确保缺口至少 500 */
    /* 指南的「限能量平衡膳食」区间并非硬性上限：
       体力活动大的人消耗高，1500 kcal 仍能形成充足缺口，不必强行压到这里。
       因此只把它当参考下限，超出上限时给出提示而不截断。 */
    if(target<OFFICIAL.kcal.f[0]){target=OFFICIAL.kcal.f[0];floorNote='low'}
    /* 小个子 / 低消耗人群：限能量下限可能低于基础代谢，
       此时抬高到 BMR（宁可缺口小一点，也不吃不够） */
    if(target<bmr){target=bmr;clampedHigher=true}
    target=Math.round(target/10)*10;
    if(target>kcalRange[1])floorNote='high';
    adjust=target/tdee-1;
  }else{
    adjust=P.goal==='gain'?0.12:0;
    target=Math.round(tdee*(1+adjust)/10)*10;
  }
  const deficit=tdee-target;                    /* 热量缺口（正数为缺口） */
  const pct=Math.min(100,Math.round(total/Math.max(1,target)*100));
  const over=total-target;
  /* 缺口 → 预期减重（1kg 脂肪 ≈ 7700 kcal） */
  const weekLoss=deficit>0?Math.round(deficit*7/7700*100)/100:0;
  const monthLoss=Math.round(weekLoss*4.3*10)/10;
  const dayLeft=Math.max(0,target-total);       /* 今日还可摄入 */

  /* 官方区间校验：本周减重速度是否落在 0.5–1kg（每月 2–4kg）
     小个子被 BMR 兜底抬高时，缺口天然偏小，这属于合理区间，不算"偏慢" */
  const lossInRange=(weekLoss>=OFFICIAL.lossWeek[0]&&weekLoss<=OFFICIAL.lossWeek[1])||clampedHigher;
  const lossTag=!filled?'':(deficit<=0?'无缺口'
    :(clampedHigher?'已按基础代谢保底，缺口 '+deficit+' kcal ✓'
     :(weekLoss<OFFICIAL.lossWeek[0]?'偏慢，可略减 100–200 kcal'
      :(weekLoss>OFFICIAL.lossWeek[1]?'偏快，建议放宽 200 kcal'
       :'理想速度 ✓'))));

  /* ── 三大营养素（按官方供能比中值：碳水55% / 脂肪25% / 蛋白20%）──
     蛋白质同时参考体重 1.2–1.6g/kg，取两者较大值，避免掉肌肉 */
  const proByPct=Math.round(target*0.20/4);
  const proByKg=Math.round(P.weight*1.4);
  const protein=Math.max(proByPct,proByKg);
  const carbK=Math.round(target*0.55/4);
  const fatK=Math.round(target*0.25/9);
  const proPct=Math.round(protein*4/target*100);
  const carbPct=Math.round(carbK*4/target*100);
  const fatPct=Math.round(fatK*9/target*100);

  /* ── 三餐供能比 3:4:3 ── */
  const RATIO=[3,4,3];
  const quotaOf=(i)=>Math.round(target*RATIO[i]/10/10)*10;

  /* ── 今日地区与季节食谱 ── */
  const regKey=(P.region&&REGION[P.region])?P.region:'hd';
  const reg=REGION[regKey];
  const season=seasonOf(new Date().getMonth()+1);
  const seasonMenu=reg.s[season]||reg.s['春'];
  /* 选最贴近目标热量的一档（1200/1400/1600） */
  const menuIdx=(()=>{
    let bi=0,bd=1e9;
    seasonMenu.forEach((m,i)=>{const d=Math.abs(m.k-target);if(d<bd){bd=d;bi=i}});
    return bi;
  })();
  const menu=seasonMenu[menuIdx];
  /* 主食份量：指南里碳水主食一般 50g 生米上下，按目标热量同比缩放 */
  const stapleG=Math.round(50*target/1400/5)*5||50;

  /* ── 习惯打卡（按天存储）── */
  const hab=dayDone('habit');
  const hk=hab.k;
  const water=hk.water||0;
  const waterOK=water>=OFFICIAL.water[0];
  const dinnerTime=hk.dinner||'';
  const dinnerOK=(()=>{
    if(!dinnerTime)return false;
    const h=parseInt(String(dinnerTime).split(':')[0],10);
    return h>=OFFICIAL.dinner[0]&&h<OFFICIAL.dinner[1];
  })();
  const orderOK=!!hk.order;

  /* ── 后续餐食推荐引擎 ──
     1) 按当前时间判断还剩哪几餐
     2) 剩余额度按各餐权重分配
     3) 从备选餐库挑选热量最接近的候选（同餐次不重复） */
  const nowH=new Date().getHours();
  /* 每餐的建议时段与权重：越晚的餐次占比越低，符合减脂节奏 */
  const MEALPLAN=[
    {m:'早餐',e:'🌅',from:0,to:10,w:.28},
    {m:'午餐',e:'🌞',from:10,to:15,w:.36},
    {m:'晚餐',e:'🌙',from:15,to:21,w:.28},
    {m:'加餐',e:'🍎',from:0,to:24,w:.08}
  ];
  const remaining=target-total;                       /* 剩余可摄入额度 */
  /* 已过时段且已记录过的餐次视为已完成 */
  const passed=MEALPLAN.filter(x=>x.m!=='加餐'&&nowH>=x.to&&mealSum(log,x.m)>0).map(x=>x.m);
  /* 待安排：还没到时段 或 到了但没记录 */
  const todo=MEALPLAN.filter(x=>x.m!=='加餐'&&!passed.includes(x.m)&&(nowH<x.to));
  /* 剩余额度按官方 3:4:3 的比例分摊到未完成的餐次 */
  const ratioOf=m=>m==='早餐'?RATIO[0]:(m==='午餐'?RATIO[1]:RATIO[2]);
  const used=new Set();                                  /* 跨餐次去重，保证推荐多样 */
  const plan=todo.map(x=>{
    const tw=todo.reduce((a,b)=>a+ratioOf(b.m),0)||1;
    let quota=Math.round(remaining*ratioOf(x.m)/tw/10)*10;
    quota=Math.max(80,quota);
    /* 晚餐/加餐优先轻食，午餐/早餐优先正餐与轻食 */
    const prefer=x.m==='晚餐'?['轻食','正餐']:['正餐','轻食'];
    const fits=f=>f.k<=quota+80&&!used.has(f.n);
    let pool=prefer.map(t=>D.备选餐.filter(f=>f.tag===t&&fits(f))).flat();
    if(!pool.length)pool=D.备选餐.filter(fits);
    if(!pool.length)pool=D.备选餐.filter(f=>f.tag==='加餐'&&!used.has(f.n));
    const cand=pool.slice().sort((a,b)=>Math.abs(a.k-quota)-Math.abs(b.k-quota)).slice(0,2);
    cand.forEach(c=>used.add(c.n));
    return {meal:x.m,e:x.e,quota,cand};
  });
  /* 是否建议加餐：剩余额度够且距下一餐还久 */
  const snackOK=remaining>200&&nowH>=14&&nowH<18;

  /* ── 个性化推荐（宏量营养素已按央妈指南计算，此处只给运动方案） ── */
  const recEx=(ACT[P.act].f>=1.55)
   ?{many:'4–5 次 / 周',plan:'有氧 30 分钟 + 力量 20 分钟，穿插 1 天恢复日',ex:'全身燃脂 20 分钟 / HIIT 跳绳 12 分钟'}
   :{many:'3 次 / 周',plan:'从低强度起步：快走或慢跑 25 分钟 + 基础力量 15 分钟',ex:'腹部塑形 15 分钟 / 拉伸放松 10 分钟'};
  const advice=!filled
   ?'请先填写身高、体重、年龄，即可自动计算你的专属热量缺口。'
   :(P.goal==='lose'
     ?(bmi<18.5?'⚠️ 当前体重偏轻，不建议继续减脂。建议把目标调整为「保持」，优先增加肌肉量。'
      :(bmi>=28?'体质指数偏高，建议在保证蛋白质摄入的前提下，把缺口控制在 500 kcal 以内，循序渐进。'
       :'当前体型在健康区间，按此缺口每周可稳定减 0.5kg 左右，是最不容易反弹的节奏。'))
     :(P.goal==='gain'
      ?'增肌期需要热量盈余，建议优先保证蛋白质与力量训练，每周增重 0.25kg 为佳，避免脂肪堆积。'
      :'保持期摄入与消耗持平，重点放在蛋白质充足与规律运动，维持体成分稳定。'));

  /* ── 官方食谱三餐卡：餐次供能比例 + 地区/季节菜单 + 一键记入 ── */
  const MEAL_SLOT=['早','午','晚'];
  const mealCard=(label,key,i,acc)=>{
    const mIdx=LS.get('menu_'+key,0)||0;
    const cur=seasonMenu[mIdx]||seasonMenu[0];
    const dish=cur[MEAL_SLOT[i]]||'';
    const quota=quotaOf(i);
    const has=log.items.some(x=>x.meal===key&&x.n===dish);
    return `<div class="card" style="--acc:${acc.acc};--accs:${acc.accs}">
      <h2>${label} <span class="badge" style="background:${acc.tg}">建议 ${quota} kcal</span></h2>
      <div class="mini" style="margin:-2px 0 7px">${esc(reg.e+' '+reg.n+'·'+season)} · 占全天 ${RATIO[i]*10}%</div>
      <div class="item" style="background:${acc.bgc}">
        <div class="t" style="font-size:13px;line-height:1.6">${esc(dish)}</div>
        <div class="m"><span class="tag" style="background:${acc.tg}">${esc(`${stapleG}g 主食 · 蛋白约 ${Math.round(protein/3)}g`)}</span></div>
      </div>
      <div style="display:flex;gap:6px;margin-top:9px">
        <button class="btn sm" data-menu="${key}">🔄 换一份</button>
        <button class="btn sm ${has?'pri':''}" style="--acc:${acc.acc};--accs:${acc.accs}" data-add="${key}|${esc(dish)}|${quota}">${has?'✅ 已记录':'＋ 记入今日'}</button>
      </div>
    </div>`};

  /* 供自动化测试读取计算结果（不参与渲染） */
  window.__dietDebug={remaining,plan,todo:todo.map(x=>x.m),snackOK,target,deficit,protein,carbK,fatK,
    quota:[quotaOf(0),quotaOf(1),quotaOf(2)],regKey,season,menuIdx,stapleG,water,dinnerOK,orderOK,lossInRange,
    bmr,tdee,monthLoss,clampedHigher,waterOK,lossTag,floorNote,filled};
  return `
  <div class="head"><h1>🥗 每日减脂饮食</h1><p>身高体重记录 · 热量缺口计算 · 个性化推荐</p></div>

  <!-- 体质档案 -->
  <div class="card tint" style="--acc:${PASTEL[3].acc};--bgc:${PASTEL[3].bgc}">
    <h2>🧬 我的体质档案 <span class="badge">${bmi?bt.n:''}</span></h2>
    <div class="grid2" style="gap:6px;margin-bottom:6px">
      <select class="in" id="bsex">
        <option value="f" ${P.sex==='f'?'selected':''}>女性</option>
        <option value="m" ${P.sex==='m'?'selected':''}>男性</option>
      </select>
      <input class="in" id="bage" type="number" inputmode="numeric" placeholder="年龄" value="${P.age||''}">
      <input class="in" id="bh" type="number" inputmode="decimal" placeholder="身高 cm" value="${P.height||''}">
      <input class="in" id="bw" type="number" inputmode="decimal" placeholder="体重 kg" value="${P.weight||''}">
    </div>
    <select class="in" id="bact" style="margin-bottom:6px">
      ${Object.keys(ACT).map(k=>`<option value="${k}" ${P.act===k?'selected':''}>${ACT[k].n} · ${ACT[k].d}</option>`).join('')}
    </select>
    <div style="display:flex;gap:6px;margin-bottom:8px">
      ${[['lose','减脂'],['keep','保持'],['gain','增肌']].map(([k,n])=>
        `<button class="btn sm" data-goal="${k}" style="flex:1;${P.goal===k?'background:'+PASTEL[3].acc+';color:#fff;border-color:transparent':''}">${n}</button>`).join('')}
    </div>
    <button class="btn pri wide" style="--acc:${PASTEL[3].acc};--accs:${PASTEL[3].accs}" id="bsave">保存并重新计算</button>
    ${filled?`<div class="hr"></div>
    <div class="grid2" style="gap:6px">
      <div class="stat" style="background:#fff"><b style="color:${PASTEL[3].acc}">${bmi}</b><span>BMI 体质指数</span></div>
      <div class="stat" style="background:#fff"><b style="color:${bt.c}">${bt.n}</b><span>体重区间</span></div>
      <div class="stat" style="background:#fff"><b style="color:${PASTEL[2].acc}">${bmr}</b><span>基础代谢 kcal</span></div>
      <div class="stat" style="background:#fff"><b style="color:${PASTEL[0].acc}">${tdee}</b><span>每日消耗 kcal</span></div>
    </div>
    <div class="mini" style="margin-top:7px">理想体重区间：${ilo} – ${ihi} kg${P.weight>ihi?`，距上限还需减 ${Math.round((P.weight-ihi)*10)/10} kg`:''}${P.weight<ilo?`，建议至少增至 ${ilo} kg`:''}</div>`:''}
  </div>

  <!-- 热量缺口 -->
  <div class="card tint" style="--acc:${PASTEL[0].acc};--bgc:${PASTEL[0].bgc}">
    <h2>🔥 今日热量缺口 <span class="badge">${filled?(deficit>0?'缺口 '+deficit:'盈余 '+(-deficit))+' kcal':'待填写档案'}</span></h2>
    <div class="kv"><b style="color:${PASTEL[0].acc}" id="kcalnum">${total}</b><span>/ 目标 ${filled?target:'—'} kcal</span></div>
    <div class="bar"><i style="--acc:${PASTEL[0].acc};width:${pct}%" id="kcalbar"></i></div>
    <div class="grid2" style="gap:6px;margin-top:8px">
      <div class="stat" style="background:#fff"><b style="color:${deficit>0?PASTEL[0].acc:'#9A9A9A'}">${filled?(deficit>0?deficit:0):'—'}</b><span>每日热量缺口</span></div>
      <div class="stat" style="background:#fff"><b style="color:${PASTEL[6].acc}">${filled?weekLoss:'—'}</b><span>预计周减重 kg</span></div>
    </div>
    ${filled&&lossTag?`<div class="mini" style="margin-top:7px">📏 减重速度：<b style="color:${lossInRange?PASTEL[0].acc:PASTEL[1].acc}">${lossTag}</b>　｜　约 ${monthLoss} kg / 月（指南建议 2–4 kg）</div>`:''}
    ${filled&&clampedHigher?`<div class="mini" style="margin-top:4px;color:#9A9A9A">你的基础代谢约 ${bmr} kcal，已按此保底，不再往下压。想吃得更少不如多动一点。</div>`:''}
    ${filled&&floorNote==='high'?`<div class="mini" style="margin-top:4px;color:#9A9A9A">你消耗较高（${tdee} kcal），指南的 ${OFFICIAL.kcal.f[0]}–${OFFICIAL.kcal.m[1]} kcal 属"低能量膳食"档，不必硬压到那里；按缺口 ${deficit} kcal 执行即可。</div>`:''}
    <div class="hr"></div>
    <div class="mini">${!filled?'填写上方体质档案后，这里会自动算出你的每日热量缺口与预期减重速度。'
      :(total===0?'今日尚未记录饮食。建议在三餐中选择搭配，凑够 '+target+' kcal 左右即可。'
      :(over>150?'今日已超目标 '+over+' kcal，建议晚餐改为清淡蛋白+蔬菜，或增加 30 分钟有氧 🏃'
       :(dayLeft>0?'今日还可摄入约 '+dayLeft+' kcal，注意不要用高糖零食填补 🌿'
        :'今日摄入基本达标，保持这个节奏 ✅')))}</div>
    <div class="hr"></div>
    <button class="btn sm" id="kcalreset">♻️ 清空今日记录</button>
  </div>

  <!-- 自由饮食记录 -->
  <div class="card tint" style="--acc:${PASTEL[4].acc};--bgc:${PASTEL[4].bgc}">
    <h2>📝 记录我今天吃的 <span class="badge">${log.items.length} 条</span></h2>
    <div class="mini" style="margin-bottom:7px">不必照着推荐食谱，吃了什么就记什么。热量可查包装营养成分表，或按下方常用食物估算。</div>
    <div style="display:flex;gap:6px;margin-bottom:6px">
      <select class="in" id="fmeal" style="flex:0 0 88px">
        ${DIET_MEALS.map(([m,e])=>`<option value="${m}">${e} ${m}</option>`).join('')}
      </select>
      <input class="in" id="fname" placeholder="食物名称，如：牛肉面" style="flex:1 1 auto;min-width:0">
    </div>
    <div style="display:flex;gap:6px;margin-bottom:6px">
      <input class="in" id="fkcal" type="number" inputmode="numeric" placeholder="热量 kcal" style="flex:1 1 auto;min-width:0">
      <button class="btn pri" style="--acc:${PASTEL[4].acc};--accs:${PASTEL[4].accs};flex:0 0 auto" id="fadd">＋ 添加</button>
    </div>
    <div class="mini" style="margin-bottom:5px">常用食物快捷加（点击即记）</div>
    <div id="quick">
      ${D.常用食物.map(f=>`<span class="pill" data-quick="${esc(f[0])}|${f[1]}" style="background:${PASTEL[4].tg}">${esc(f[0])} ${f[1]}</span>`).join('')}
    </div>
    ${log.items.length?`<div class="hr"></div>
    ${DIET_MEALS.map(([m,e])=>{
      const arr=log.items.map((it,idx)=>({it,idx})).filter(x=>x.it.meal===m);
      if(!arr.length)return '';

/* ⑤ 热点新闻 —— 实时抓取
   每个分类配多级候选 RSS 源（经 rss2json 桥转 JSON，支持跨域），
   全部失败时回落到内置静态内容。按天+分类缓存，30 分钟过期。 */
const NEWS_FEEDS={
  科技:['https://www.ithome.com/rss/','https://sspai.com/feed'],
  财经:['https://dedicate.wallstreetcn.com/rss.xml','https://feeds.a.dj.com/rss/RSSMarketsMain.xml','https://www.ithome.com/rss/'],
  生活:['https://sspai.com/feed','https://www.ithome.com/rss/'],
  娱乐:['https://www.ithome.com/rss/','https://sspai.com/feed'],
  时政:['https://feedx.net/rss/thepaper.xml','https://feeds.a.dj.com/rss/RSSWorldNews.xml']
};
const NEWS_TTL=30*60*1000;               /* 缓存有效期：30 分钟 */
const NEWS_LAST='newsLastTry';           /* 防抖时间戳：{cat: ms} */

const newsCacheGet=(cat)=>{
  const c=LS.get('newsCache',null);
  if(!c||c.d!==todayKey()||!c[cat])return null;
  const e=c[cat];
  return (e&&e.items&&e.items.length)?e:null;
};
const newsCacheSet=(cat,data)=>{
  const tk=todayKey();
  const c=LS.get('newsCache',null)||{};
  if(c.d!==tk){for(const k in c)delete c[k];c.d=tk}
  c[cat]=Object.assign({at:Date.now()},data);
  try{LS.set('newsCache',c)}catch(e){}
};
const newsFresh=cat=>{const e=newsCacheGet(cat);return !!e&&(Date.now()-e.at)<NEWS_TTL};

/* 清洗 RSS 条目：解码实体、去 HTML 标签、压缩空白、截断摘要 */
const newsClean=(s,n)=>{
  const txt=String(s||'')
    .replace(/<[^>]*>/g,' ')
    .replace(/&nbsp;/gi,' ').replace(/&lt;/gi,'<').replace(/&gt;/gi,'>')
    .replace(/&quot;/gi,'"').replace(/&#39;/gi,"'").replace(/&apos;/gi,"'")
    .replace(/&mdash;/gi,'—').replace(/&hellip;/gi,'…')
    .replace(/&amp;/gi,'&')                       /* &amp; 必须最后解码 */
    .replace(/\s+/g,' ').trim();
  return txt.length>n?txt.slice(0,n)+'…':txt;
};

/* 从单个 RSS 源抓取（rss2json 桥，免费无需 Key，支持 CORS） */
const newsFetchFeed=async(feed)=>{
  const q='https://api.rss2json.com/v1/api.json?rss_url='+encodeURIComponent(feed);
  const ctl=(typeof AbortController!=='undefined')?new AbortController():null;
  const timer=ctl?setTimeout(()=>ctl.abort(),9000):null;
  try{
    const r=await fetch(q,ctl?{signal:ctl.signal}:{});
    if(!r.ok)throw new Error('http '+r.status);
    const j=await r.json();
    if(!j||j.status!=='ok'||!j.items||!j.items.length)throw new Error('empty');
    return j.items.map(it=>({
      t:newsClean(it.title,64),
      d:newsClean(it.description||it.content,68)||newsClean(it.title,68),
      l:it.link||'',
      p:it.pubDate?newsClean(it.pubDate,16):''
    }));
  }finally{if(timer)clearTimeout(timer)}
};

/* 按分类抓取：依序尝试候选源，拿到即止 */
const newsFetch=async(cat)=>{
  const feeds=NEWS_FEEDS[cat]||[];
  for(const f of feeds){
    try{
      const items=await newsFetchFeed(f);
      if(items&&items.length>=3){newsCacheSet(cat,{items,src:f});return items}
    }catch(e){/* 换下一个源 */}
  }
  throw new Error('all-feeds-failed');
};

/* =========================================================
   每日自动刷新
   ---------------------------------------------------------
   纯前端无法在浏览器关闭时后台运行，因此采用两种机制：
   1) 页面保持打开 → 每分钟检测跨天，自动重置当日数据并刷新
   2) 打开/切回页面 → 立即检测，若已是新的一天则自动更新
   ========================================================= */
const DAY_KEY='dayMark';           /* 记录最近一次渲染所属的日期 */
let dayTimer=null;

/* 重置所有"按日"数据，让新的一天从干净状态开始 */
function rolloverDay(tk){
  /* 今日热量记录 */
  const log=LS.get('kcal',null);
  if(log&&log.d!==tk)LS.set('kcal',{d:tk,items:[]});
  /* 每日灵感金句 */
  const q=LS.get('qidx',null);
  if(q&&q.d!==tk)LS.set('qidx',{d:tk,i:(Math.random()*D.灵感.length)|0});
  /* 今日自省 */
  const r=LS.get('reflect',null);
  if(r&&r.d!==tk)LS.set('reflect',{d:tk,i:(Math.random()*D.自省.length)|0});
  /* 理财今日重点 */
  const pl=LS.get('plan',null);
  if(pl)LS.set('plan',{d:tk,list:shuffle(D.理财).slice(0,3).map(x=>x.n)});
  /* 英语：重排今日资讯与口语内容（进度与生词本为累计数据，保留不变）
     注意：此处用"旧标记 + 新日期"作为种子，避免当天打开时
     dayMark 已等于今天却因缓存的函数上下文导致 enDay 未被更新。 */
  reshuffleEN();
  ensureEN();
  LS.set('enDay',tk);                       /* 记录英语内容所属日期，便于回溯 */
  window.__enOrder=_enRead?_enRead.map(r=>r.src+':'+r.title):[];
  /* 英语打卡状态按日归零：新的一天从"未读 / 未打卡"重新开始
     （生词本、每周复习记录为累计数据，不在此处重置） */
  if(LS.get('readdone',null)!==null)LS.set('readdone',{d:tk,k:{}});
  if(LS.get('speak',null)!==null)LS.set('speak',{d:tk,k:{}});
  /* 天气：跨天后昨日天气预报已失效，清掉自动获取的缓存，
     交由穿搭模块的按需自动刷新重新拉取，避免展示隔夜数据。
     手动填写的天气（wxManual）按用户意图保留。 */
  LS.set('weather',null);
  LS.set(WX_LAST,0);
  /* 新闻：跨天后昨日资讯已过期，清空缓存让新闻模块重新抓取当日内容 */
  LS.set('newsCache',null);
  LS.set(NEWS_LAST,{});
  /* 饮食习惯打卡（饮水 / 晚餐时间 / 进餐顺序）：按日归零 */
  const hb=LS.get('habit',null);
  if(hb&&hb.d!==tk)LS.set('habit',{d:tk,k:{}});
  LS.set(DAY_KEY,tk);
}

/* 检测是否需要跨天刷新；返回是否发生了刷新 */
function checkDay(){
  const tk=todayKey();
  const mark=LS.get(DAY_KEY,null);
  if(mark===tk)return false;
  rolloverDay(tk);
  /* 重新渲染当前模块，让新数据立即生效 */
  if(current)render(current);
  if(typeof paintDate==='function')paintDate();
  const changed=!!mark;      /* 首次打开不算"跨天"，不提示 */
  if(changed)toast('已是新的一天，已为你刷新 ☀️（含英语资讯与天气）');
  return changed;
}

/* 每分钟检测一次；页面切回可见时也立即检测（后台标签页定时器会被节流） */
function startDayWatch(){
  if(dayTimer)clearInterval(dayTimer);
  dayTimer=setInterval(checkDay,60000);
  window.__dayTimer=dayTimer;               /* 暴露句柄，便于检测与清理 */
  document.addEventListener('visibilitychange',()=>{
    if(document.visibilityState==='visible')checkDay();
  });
}

/* 手动刷新：换新当日随机内容并重渲染（不重置录入类数据） */
function refreshToday(){
  const tk=todayKey();
  LS.set('qidx',{d:tk,i:(Math.random()*D.灵感.length)|0});
  LS.set('reflect',{d:tk,i:(Math.random()*D.自省.length)|0});
  LS.set('plan',{d:tk,list:shuffle(D.理财).slice(0,3).map(x=>x.n)});
  /* 英语：重新抽取今日内容（重新播种，顺序会变化） */
  reshuffleEN();
  ensureEN();
  LS.set('enDay',tk);
  window.__enOrder=_enRead?_enRead.map(r=>r.src+':'+r.title):[];
  /* 天气：手动刷新时一并刷新（仅在有自动天气或非手动模式下发起，避免覆盖手动输入） */
  LS.set(WX_LAST,0);
  if(LS.get('weather',null)&&!LS.get('wxManual',null)){
    const _sm='refreshToday';window[_sm+'_wx']=1;
    fetchWeather().then(w=>{w.manual=false;LS.set('weather',w);LS.set(WX_LAST,Date.now());
      if(current==='穿搭')render('穿搭',true);
    }).catch(()=>{});
  }
  LS.set(DAY_KEY,tk);
  const stamp=new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});
  LS.set('lastRefresh',stamp);
  if(current)render(current);
  toast('已刷新今日内容（含英语资讯与天气）· '+stamp);
}

/* =========================================================
   主控制器
   ========================================================= */
let current=null;
function render(k,keepScroll){
  const same=current===k;
  current=k;
  const m=MODULES.find(x=>x.k===k);
  const acc=PASTEL[MODULES.indexOf(m)%PASTEL.length];
  const main=$('#main');
  const y=main.scrollTop;
  main.innerHTML=R[k]();
  main.style.setProperty('--acc',acc.acc);
  main.style.setProperty('--accs',acc.accs);
  EV[k]&&EV[k]();
  if(keepScroll||same){main.scrollTop=y}   /* 模块内交互：保持滚动位置 */
  else{main.scrollTop=0}                    /* 切换模块：回到顶部 */
}
function go(k){
  if(current===k)return;
  $$('#nav .navitem').forEach(n=>n.classList.toggle('on',n.dataset.k===k));
  LS.set('last',k);
  render(k);
}
function buildNav(){
  const nav=$('#nav');
  MODULES.forEach((m,i)=>{
    const p=PASTEL[i%PASTEL.length];
    const el=document.createElement('div');
    el.className='navitem';el.dataset.k=m.k;
    el.style.setProperty('--acc',p.acc);
    el.innerHTML=`<span class="dot"></span><span class="ico">${m.ico}</span><span class="txt">${m.name}</span>`;
    el.onclick=()=>go(m.k);
    nav.appendChild(el);
  });
}

/* 顶栏日期显示：月/日 + 星期 */
function paintDate(){
  const el=$('#bdate');if(!el)return;
  const d=new Date();
  const wd=['日','一','二','三','四','五','六'][d.getDay()];
  el.textContent=(d.getMonth()+1)+'/'+d.getDate()+' 周'+wd;
}

/* 启动 */
buildNav();
paintDate();
LS.set(DAY_KEY,todayKey());          /* 首次打开标记为今天，不触发跨天提示 */
ensureEN();LS.set('enDay',todayKey());/* 按打开当天生成英语内容顺序 */
go(LS.get('last','灵感')||'灵感');
startDayWatch();                     /* 开启跨天自动刷新 */

/* 手动刷新按钮 */
(function(){
  const b=$('#brefresh');if(!b)return;
  b.onclick=()=>{
    b.classList.remove('spin');
    void b.offsetWidth;              /* 重置动画 */
    b.classList.add('spin');
    setTimeout(()=>b.classList.remove('spin'),420);
    refreshToday();
    paintDate();
  };
})();

/* 防止某些浏览器双指缩放导致横向溢出 */
document.addEventListener('touchmove',e=>{if(e.touches.length>1)e.preventDefault()},{passive:false});
/* 桌面端键盘导航（可选） */
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;
  const i=MODULES.findIndex(x=>x.k===current);
  if(e.key==='ArrowDown'&&i<MODULES.length-1)go(MODULES[i+1].k);
  if(e.key==='ArrowUp'&&i>0)go(MODULES[i-1].k);
});
</script>
